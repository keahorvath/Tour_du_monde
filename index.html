<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Around the world — a notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F0E8; --panel:#FBFAF5; --ink:#16262B; --ink-soft:#5E6B67;
  --ocean:#CFDAD8; --rule:#D5CFBF;
  --l0:#E6E1D4; --l1:#EBC98D; --l2:#D4894B; --l3:#A63D2E;
  --cuisine:#B5471E; --culture:#2B5D8C; --lecture:#5C7A3F;
  --display:"Bricolage Grotesque",'Trebuchet MS',sans-serif;
  --body:"Karla",'Helvetica Neue',Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:var(--culture)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header{padding:34px 0 0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft)}
h1{font-family:var(--display);font-weight:800;font-variation-settings:'wdth' 88;
  font-size:clamp(40px,7vw,72px);line-height:.92;margin:6px 0 0;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.stats{display:flex;gap:26px;padding-bottom:8px}
.stat{min-width:74px}
.stat b{font-family:var(--display);font-size:30px;font-weight:700;display:block;line-height:1}
.stat b em{font-family:var(--mono);font-size:12px;font-style:normal;font-weight:400;
  color:var(--ink-soft);margin-left:5px}
.stat span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);display:block;margin-top:5px}
.stat.cuisine b{color:var(--cuisine)} .stat.culture b{color:var(--culture)} .stat.lecture b{color:var(--lecture)}

nav{display:flex;gap:2px;margin:26px 0 0;border-bottom:1px solid var(--rule);overflow-x:auto}
nav button{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:11px 18px;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
nav button#tab-food[aria-selected="true"]{color:var(--cuisine);border-bottom-color:var(--cuisine)}
nav button#tab-culture[aria-selected="true"]{color:var(--culture);border-bottom-color:var(--culture)}
nav button#tab-books[aria-selected="true"]{color:var(--lecture);border-bottom-color:var(--lecture)}
nav button#tab-quiz[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.load{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);
  margin:14px 0 -6px;min-height:14px}
.load.ok{color:var(--lecture)} .load.bad{color:var(--cuisine)}

.view{display:none;padding:22px 0 70px}
.view.on{display:block}
.mapbox{background:var(--ocean);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
svg.map{display:block;width:100%;height:auto}
.grat{stroke:#B9C7C5;stroke-width:.0025;fill:none}
.cty{stroke:#F2F0E8;stroke-width:.004;stroke-linejoin:round;transition:fill .15s}
.cty[data-lv="0"]{fill:var(--l0)} .cty[data-lv="1"]{fill:var(--l1)}
.cty[data-lv="2"]{fill:var(--l2)} .cty[data-lv="3"]{fill:var(--l3)}
.cty.hit{cursor:pointer}
.cty.hit:hover,.cty.sel{stroke:var(--ink);stroke-width:.012}
.dot{stroke:var(--ink);stroke-width:.0045}
.dot.faint{stroke:#A9B7B5;stroke-width:.0035}
.dot.hit{cursor:pointer}
.dot.hit:hover{stroke-width:.013}
.legend{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:14px;
  font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.ramp{display:flex;align-items:center;gap:6px}
.sw{width:22px;height:11px;border:1px solid rgba(0,0,0,.14)}

.tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:#F7F4EC;
  padding:7px 11px;border-radius:2px;font-size:13px;opacity:0;transition:opacity .1s;max-width:230px}
.tip b{font-family:var(--display);font-weight:600;display:block;font-size:14px}
.tip .st{margin-top:5px}

.stamp{display:inline-flex;gap:3px;vertical-align:middle}
.stamp i{width:8px;height:8px;border-radius:50%;border:1.4px solid currentColor;display:block}
.stamp i.d{background:currentColor}
.stamp .c1{color:var(--cuisine)} .stamp .c2{color:var(--culture)} .stamp .c3{color:var(--lecture)}
.tip .stamp i{border-color:#F7F4EC} .tip .stamp i.d{background:#F7F4EC}
.tip .stamp .c1,.tip .stamp .c2,.tip .stamp .c3{color:#F7F4EC}

/* étoiles avec demi-crans */
.stars{position:relative;display:inline-block;font-size:12.5px;letter-spacing:1.5px;
  color:var(--rule);white-space:nowrap;line-height:1}
.stars i{position:absolute;left:0;top:0;overflow:hidden;color:var(--cuisine);font-style:normal}
.sec.c3 .stars i{color:var(--lecture)}
.stars b{font-weight:400;visibility:hidden}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tools input,.tools select{font:inherit;font-size:13.5px;padding:8px 11px;background:var(--panel);
  border:1px solid var(--rule);border-radius:2px;color:var(--ink)}
.tools input{flex:1;min-width:190px}
.count{font-family:var(--mono);font-size:11px;color:var(--ink-soft);align-self:center;margin-left:auto}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;gap:14px;align-items:center;width:100%;text-align:left;
  padding:13px 6px;border-bottom:1px solid var(--rule)}
.row.food{grid-template-columns:34px 1fr auto auto}
.row.books{grid-template-columns:34px 1fr auto auto}
.row.culture{grid-template-columns:34px 1fr auto}
.row:hover{background:#EAE7DC}
.row .nm{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:-.01em}
.row .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.row .dt{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.row .th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--culture);margin-right:7px}
.empty{padding:40px 6px;color:var(--ink-soft)}

.scrim{position:fixed;inset:0;background:rgba(22,38,43,.34);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:70}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(430px,100%);background:var(--panel);
  border-left:1px solid var(--rule);transform:translateX(102%);transition:transform .25s ease;
  z-index:80;overflow-y:auto;padding:22px 26px 60px}
.sheet.on{transform:none}
.sheet .x{position:absolute;top:14px;right:16px;font-size:22px;line-height:1;color:var(--ink-soft)}
.sheet h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1;margin:14px 0 6px;
  letter-spacing:-.02em;padding-right:30px}
.meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}

.idcard{margin-top:18px;border:1px solid var(--rule);border-radius:3px;background:#F5F3EA;padding:14px 16px}
.idhead{display:flex;gap:12px;align-items:center;margin-bottom:13px}
.flag{width:54px;height:36px;object-fit:cover;border:1px solid rgba(0,0,0,.18);border-radius:2px;
  flex:none;display:block;background:#E6E1D4}
.flag-fb{font-size:32px;line-height:36px;flex:none}
.idhead .off{font-size:13.5px;line-height:1.25;font-weight:500}
.idhead .nat{font-size:12.5px;color:var(--ink-soft);margin-top:2px}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:13.5px;align-items:baseline}
dl.facts dt{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
dl.facts dd{margin:0}
dl.facts dd em{font-style:normal;font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
.tags{margin-top:11px}
.fnote{margin:10px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-soft);
  padding-top:10px;border-top:1px solid var(--rule)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--rule);padding:3px 7px;border-radius:2px;color:var(--ink-soft);margin:0 5px 5px 0}

.sec{margin-top:26px;padding-left:14px;border-left:3px solid var(--rule)}
.sec.c1{border-color:var(--cuisine)} .sec.c2{border-color:var(--culture)} .sec.c3{border-color:var(--lecture)}
.sec h3{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  margin:0 0 9px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.sec.c1 h3{color:var(--cuisine)} .sec.c2 h3{color:var(--culture)} .sec.c3 h3{color:var(--lecture)}
.sec ul{margin:0 0 8px;padding-left:17px}
.sec li{margin-bottom:2px}
.item+.item{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.deck .dslide{display:none} .deck .dslide.on{display:block}
.dnav{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dnav button{width:22px;height:22px;border:1px solid var(--rule);border-radius:50%;
  line-height:1;font-size:15px;color:var(--ink-soft);background:#fff;
  display:flex;align-items:center;justify-content:center;padding-bottom:2px}
.dnav button:hover{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.dcount{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-soft)}
.when{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);margin:0 0 7px}
.note{font-style:italic;margin:8px 0 0}
.todo{color:var(--ink-soft);font-size:13.5px;margin:0}
.shot{display:block;width:100%;margin:12px 0 0;border-radius:2px;border:1px solid var(--rule);background:var(--l0)}
.photo{margin:12px 0 0;border:1.5px dashed var(--rule);border-radius:2px;height:120px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;
  color:var(--ink-soft);text-align:center;padding:0 20px;line-height:1.6}
.photo span{font-size:10px;opacity:.7}
.rl{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;
  border:1px solid var(--rule);border-radius:50%;color:var(--cuisine);text-decoration:none;
  vertical-align:-4px;margin-left:5px;background:#fff;transition:background .15s,color .15s,border-color .15s}
.rl:hover{background:var(--cuisine);border-color:var(--cuisine);color:#FBFAF5}
.rl svg{width:9px;height:9px;display:block}
.notes{list-style:none;padding:0;margin:0}
.notes li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:13.5px;line-height:1.45}
.notes li:last-child{border-bottom:none}
.notes li.fav{padding-left:10px;border-left:2px solid var(--culture);margin-left:-12px}
.notes .th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--culture);display:block;margin-bottom:3px}
.notes .src{display:inline-flex;width:14px;height:14px;color:var(--ink-soft);margin-left:5px;vertical-align:-2px}
.notes .src svg{width:9px;height:9px}
.bkrow{display:flex;gap:12px;align-items:flex-start}
.bkrow>div{flex:1;min-width:0}
.cover{width:62px;flex:none;border:1px solid var(--rule);border-radius:2px;background:var(--l0);
  display:block;order:2}
.bk{margin:0 0 4px;font-size:14.5px;line-height:1.35}
.bkm{margin:0 0 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-soft)}

/* ---------- quiz ---------- */
.quiz{max-width:640px}
.qintro p{margin:0 0 18px;max-width:52ch}
.qstart{background:var(--ink);color:var(--panel);padding:11px 22px;border-radius:2px;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase}
.qstart:hover{background:#0C1A1E}
.qbar{height:3px;background:var(--rule);border-radius:2px;margin-bottom:22px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.qtag{color:var(--culture)}
.qtag.food{color:var(--cuisine)} .qtag.books{color:var(--lecture)}
.qtext{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.2;
  letter-spacing:-.01em;margin:0 0 22px}
.qopts{display:grid;gap:9px}
.qopt{text-align:left;padding:13px 16px;border:1px solid var(--rule);border-radius:2px;
  background:var(--panel);font-size:15px;transition:border-color .12s,background .12s}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt.right{border-color:var(--lecture);background:#EDF2E6}
.qopt.wrong{border-color:var(--cuisine);background:#F8E9E4}
.qform{display:flex;gap:9px;flex-wrap:wrap}
.qform input{flex:1;min-width:200px;font:inherit;font-size:16px;padding:12px 15px;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel);color:var(--ink)}
.qform input:focus{border-color:var(--ink);outline:none}
.qfb{margin:20px 0 0;padding-left:14px;border-left:3px solid var(--rule)}
.qfb.right{border-color:var(--lecture)} .qfb.wrong{border-color:var(--cuisine)}
.qfb p{margin:0 0 4px}
.qfb .verdict{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.qfb.right .verdict{color:var(--lecture)} .qfb.wrong .verdict{color:var(--cuisine)}
.qacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.qlink{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-soft);border-bottom:1px solid var(--rule);padding-bottom:2px}
.qlink:hover{color:var(--ink);border-color:var(--ink)}
.qscore{font-family:var(--display);font-size:56px;font-weight:700;line-height:1;letter-spacing:-.02em;margin:0}
.qscore em{font-style:normal;color:var(--ink-soft);font-size:26px}
.qmissed{margin:26px 0 0;border-top:1px solid var(--rule)}
.qmissed li{list-style:none;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14px}
.qmissed ul{padding:0;margin:0}
.qmissed .qq{color:var(--ink-soft);font-size:13px}
.qmissed b{font-weight:500}

footer{border-top:1px solid var(--rule);padding:20px 0 40px;font-family:var(--mono);font-size:11px;
  color:var(--ink-soft);line-height:1.7}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .stats{gap:18px} .stat b{font-size:24px}
  .row.food,.row.books{grid-template-columns:28px 1fr auto}
  .row .dt{display:none}
  .sheet{width:100%;border-left:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="eyebrow">Notebook · started June 2024</div>
        <h1>Around the world</h1>
      </div>
      <div class="stats">
        <div class="stat cuisine"><b id="s1">0</b><span>countries cooked</span></div>
        <div class="stat culture"><b id="s2">0</b><span>countries explored</span></div>
        <div class="stat lecture"><b id="s3">0</b><span>countries read</span></div>
      </div>
    </div>
    <nav role="tablist">
      <button role="tab" id="tab-map" aria-selected="true" aria-controls="v-map">Map</button>
      <button role="tab" id="tab-food" aria-selected="false" aria-controls="v-food">Food</button>
      <button role="tab" id="tab-culture" aria-selected="false" aria-controls="v-culture">Culture</button>
      <button role="tab" id="tab-books" aria-selected="false" aria-controls="v-books">Books</button>
      <button role="tab" id="tab-quiz" aria-selected="false" aria-controls="v-quiz">Quiz</button>
    </nav>
  </header>

  <p class="load" id="load"></p>

  <section class="view on" id="v-map" role="tabpanel" aria-labelledby="tab-map">
    <div class="mapbox"><svg class="map" id="map" viewBox="-2.70 -1.36 5.40 2.62" role="img"
      aria-label="World map; countries are shaded by how far along they are"></svg></div>
    <div class="legend">
      <div class="ramp"><span>Progress</span>
        <span class="sw" style="background:var(--l0)"></span>
        <span class="sw" style="background:var(--l1)"></span>
        <span class="sw" style="background:var(--l2)"></span>
        <span class="sw" style="background:var(--l3)"></span>
        <span>0 → 3 strands</span></div>
      <div><span class="stamp"><i class="c1 d"></i></span> food
        &nbsp; <span class="stamp"><i class="c2 d"></i></span> culture
        &nbsp; <span class="stamp"><i class="c3 d"></i></span> books</div>
      <div>Click a country to open its page</div>
    </div>
  </section>

  <section class="view" id="v-food" role="tabpanel" aria-labelledby="tab-food"></section>
  <section class="view" id="v-culture" role="tabpanel" aria-labelledby="tab-culture"></section>
  <section class="view" id="v-books" role="tabpanel" aria-labelledby="tab-books"></section>
  <section class="view" id="v-quiz" role="tabpanel" aria-labelledby="tab-quiz"></section>

  <footer id="foot"></footer>
</div>

<div class="tip" id="tip"></div>
<div class="scrim" id="scrim"></div>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON=`<svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.5"
  stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.7 1H9v5.3M9 1 1.2 8.8"/></svg>`;

/* ---- progress ---- */
const cooked=e=>!!e&&e.cook.some(c=>c.done);
const explored=e=>!!e&&e.notes.length>0;
const read=e=>!!e&&e.books.some(b=>b.done);
const lvl=e=>!e?0:(cooked(e)?1:0)+(explored(e)?1:0)+(read(e)?1:0);
const stamp=e=>`<span class="stamp"><i class="c1${cooked(e)?' d':''}"></i><i class="c2${explored(e)?' d':''}"></i><i class="c3${read(e)?' d':''}"></i></span>`;

/* ---- half-star rating ---- */
const stars=n=>{
  if(!n&&n!==0)return '';
  const p=Math.max(0,Math.min(5,n))/5*100;
  return `<span class="stars" title="${n} out of 5"><b>★★★★★</b>`+
         `<i style="width:${p}%">★★★★★</i></span>`;
};
const rl=d=>d.u?` <a class="rl" href="${esc(d.u)}" target="_blank" rel="noopener"
  title="Recipe for ${esc(d.n)}" aria-label="Recipe for ${esc(d.n)}">${ICON}</a>`:'';
const dish=d=>`<li>${esc(d.n)}${rl(d)}</li>`;
const dishInline=d=>`${esc(d.n)}${rl(d)}`;

/* ---- CSV ---- */
function parseCSV(s){
  s=s.replace(/\r\n?/g,'\n');
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){ if(c==='"'){ if(s[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'){row.push(f);out.push(row);row=[];f=''}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);out.push(row)}
  return out;
}
function records(text){
  const t=parseCSV(text);if(!t.length)return[];
  const head=t[0].map(h=>h.replace(/^\ufeff/,'').trim().toLowerCase());
  return t.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o})
          .filter(o=>Object.values(o).some(v=>v));
}
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pdate(s){
  if(!s)return null;let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return{ds:+m[1]*10000+ +m[2]*100+ +m[3],txt:+m[3]+' '+MON[+m[2]-1]+' '+m[1]};
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{4})/);
  if(m){let d=+m[1],mo=+m[2];if(d<=12&&mo>12){const x=d;d=mo;mo=x}
    return{ds:+m[3]*10000+mo*100+d,txt:d+' '+MON[mo-1]+' '+m[3]}}
  const dt=new Date(s);
  if(!isNaN(dt))return{ds:dt.getFullYear()*10000+(dt.getMonth()+1)*100+dt.getDate(),
                       txt:dt.getDate()+' '+MON[dt.getMonth()]+' '+dt.getFullYear()};
  return null;
}
const int=v=>{const n=parseInt(String(v).replace(/[^0-9-]/g,''),10);return isNaN(n)?null:n};
const dec=v=>{const n=parseFloat(String(v).replace(',','.').replace(/[^0-9.]/g,''));return isNaN(n)?null:n};

function build(food,culture,books){
  const E={},get=iso=>E[iso]||(E[iso]={iso,cook:[],notes:[],books:[]});
  (food||[]).forEach(r=>{
    const iso=(r.iso||'').toUpperCase();if(!iso)return;
    const d=pdate(r.date),rating=dec(r.rating);
    const dishes=(r.dishes||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
      const i=l.indexOf('|');
      return i<0?{n:l}:{n:l.slice(0,i).trim(),u:l.slice(i+1).trim()};
    });
    if(!dishes.length&&!d)return;
    get(iso).cook.push({dishes,date:d?d.txt:null,ds:d?d.ds:0,rating,
      comment:r.comment||null,photo:r.photo||(d?iso.toLowerCase()+'.jpg':null),done:!!(d&&rating)});
  });
  (culture||[]).forEach(r=>{
    const iso=(r.iso||'').toUpperCase();if(!iso||!r.note)return;
    const d=pdate(r.date);
    get(iso).notes.push({theme:r.theme||'',note:r.note,source:r.source||'',
      question:r.question||'',answer:r.answer||'',
      date:d?d.txt:'',ds:d?d.ds:0,fav:/^(x|yes|oui|true|1)$/i.test(r.favourite||'')});
  });
  (books||[]).forEach(r=>{
    const iso=(r.iso||'').toUpperCase();if(!iso||!r.title)return;
    const d=pdate(r.date_read||r.date);
    get(iso).books.push({title:r.title,author:r.author||null,lang:r.original_language||null,
      year:int(r.year),rating:dec(r.rating),comment:r.comment||null,
      cover:r.cover||null,isbn:(r.isbn||'').replace(/[^0-9Xx]/g,'')||null,
      date:d?d.txt:null,ds:d?d.ds:0,done:!!d});
  });
  Object.keys(E).forEach(iso=>{ if(!GEO[iso]) delete E[iso] });
  Object.values(E).forEach(e=>{
    e.cook.sort((a,b)=>b.ds-a.ds);
    e.books.sort((a,b)=>b.ds-a.ds);
    e.notes.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
  });
  return E;
}

function rob(lo,la){
  const X=[1,.9986,.9954,.99,.9822,.973,.96,.9427,.9216,.8962,.8679,.835,.7986,.7597,.7186,.6732,.6213,.5722,.5322],
        Y=[0,.062,.124,.186,.248,.31,.372,.434,.4958,.5571,.6176,.6769,.7346,.7903,.8435,.8936,.9394,.9761,1];
  const t=Math.abs(la)/5,i=Math.min(Math.floor(t),17),f=t-i;
  const x=0.8487*(X[i]+(X[i+1]-X[i])*f)*lo*Math.PI/180,
        y=1.3523*(Y[i]+(Y[i+1]-Y[i])*f);
  return [x.toFixed(4),(la<0?y:-y).toFixed(4)];
}
let GRAT='';
for(let lo=-180;lo<=180;lo+=30){let p=[];for(let la=-85;la<=85;la+=5)p.push(rob(lo,la));

for(let la=-60;la<=75;la+=30){let p=[];for(let lo=-180;lo<=180;lo+=10)p.push(rob(lo,la));

/* ---- quiz ----------------------------------------------------------------
   Les questions sont fabriquées à partir des données : aucune IA, aucune
   connexion. Si le fichier Culture contient des colonnes question / answer,
   elles sont utilisées telles quelles.
   -------------------------------------------------------------------------- */
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const BANDS=[0,1e5,5e5,1e6,5e6,1e7,2.5e7,5e7,1e8,2.5e8,5e8,1e9,2e9];
const human=n=>n>=1e9?(n/1e9)+' bn':n>=1e6?(n/1e6)+'M':n>=1e3?(n/1e3)+'k':n;
function bandOpts(v,fmt){
  let i=BANDS.findIndex((b,k)=>v>=b&&v<BANDS[k+1]); if(i<0)i=BANDS.length-2;
  const near=[i-2,i-1,i+1,i+2].filter(k=>k>=0&&k<BANDS.length-1);
  const idx=shuffle(near).slice(0,3).concat(i);
  return {opts:shuffle(idx).map(k=>({k,t:fmt(BANDS[k])+' – '+fmt(BANDS[k+1])})),good:i};
}
function mcq(tag,q,correct,pool,iso){
  const bad=shuffle([...new Set(pool.filter(x=>norm(x)!==norm(correct)))]).slice(0,3);
  if(bad.length<3)return null;
  const opts=shuffle([correct,...bad]);
  return {tag,q,iso,kind:'mcq',opts,good:opts.indexOf(correct),answer:correct};
}
function txt(tag,q,answers,iso){
  const a=answers.filter(Boolean);
  return a.length?{tag,q,iso,kind:'text',accept:a.map(norm),answer:a[0]}:null;
}
function makeQuestions(pool){
  const N=GEO,out=[];
  const nameOf=i=>N[i].n;
  const langPool=[],relPool=[],dishPool=[],titlePool=[];
  pool.forEach(i=>{
    const f=FACTS[i]; if(f&&f.lang)langPool.push(f.lang[0]);
    const r=REL[i]; if(r&&r[0])relPool.push(r[0].n);
    const e=DATA[i]; if(e){e.cook.forEach(c=>c.dishes.forEach(d=>dishPool.push(d.n)));
      e.books.forEach(b=>titlePool.push(b.title))}
  });
  pool.forEach(iso=>{
    const f=FACTS[iso],e=DATA[iso],nm=nameOf(iso);
    if(f&&f.cap)out.push(txt('Geography',`What is the capital of ${nm}?`,
      [f.cap.split(',')[0].trim(),...f.cap.split(',').map(s=>s.trim())],iso));
    if(f&&f.cur)out.push(txt('Geography',`What currency is used in ${nm}?`,
      [f.cur.split('·')[0].replace(/\(.*?\)/g,'').trim()],iso));
    if(f&&f.lang)out.push(mcq('Geography',`Which language is official in ${nm}?`,f.lang[0],
      langPool.filter(l=>!f.lang.includes(l)),iso));
    if(f&&f.pop){const b=bandOpts(f.pop,human);
      out.push({tag:'Geography',q:`Roughly how many people live in ${nm}?`,iso,kind:'mcq',
        opts:b.opts.map(o=>o.t),good:b.opts.findIndex(o=>o.k===b.good),
        answer:b.opts.find(o=>o.k===b.good).t});}
    if(REL[iso]&&REL[iso][0])out.push(mcq('Culture',`What is the largest religion in ${nm}?`,
      REL[iso][0].n,relPool,iso));
    if(!e)return;
    e.cook.forEach(c=>c.dishes.forEach(d=>{
      out.push(txt('Food',`Which country did you cook ${d.n} for?`,[nm],iso));
    }));
    const firstDish=(e.cook[0]||{dishes:[]}).dishes[0];
    if(firstDish)out.push(mcq('Food',`Which dish did you cook for ${nm}?`,firstDish.n,
      dishPool.filter(x=>!e.cook.some(c=>c.dishes.some(d=>d.n===x))),iso));
    e.books.filter(b=>b.done).forEach(b=>{
      if(b.author)out.push(txt('Books',`Who wrote ${b.title}?`,[b.author],iso));
      out.push(mcq('Books',`${b.title} — which country is it from?`,nm,
        pool.filter(i=>i!==iso&&DATA[i]&&DATA[i].books.length).map(nameOf),iso));
      if(b.year)out.push(txt('Books',`In what year was ${b.title} first published?`,[String(b.year)],iso));
    });
    e.notes.forEach(n=>{
      if(n.question&&n.answer)
        out.push(txt('Culture',n.question,n.answer.split(';').map(s=>s.trim()),iso));
      else{
        const m=n.note.match(/\b\d[\d.,]*\b/);
        if(m&&n.note.length<170)out.push(txt('Culture',
          `${nm} — fill the gap: ${n.note.replace(m[0],'______')}`,[m[0]],iso));
      }
    });
  });
  return out.filter(Boolean);
}
function drawQuiz(n){
  const scope=$('#qscope')?$('#qscope').value:'mine';
  const pool=Object.keys(GEO).filter(i=>FACTS[i]&&(scope==='all'||(DATA[i]&&lvl(DATA[i])>0)));
  const all=shuffle(makeQuestions(pool));
  const cap=Math.max(2,Math.ceil(n/3)),seen={},used={},out=[];
  for(const q of all){
    const key=q.iso+'|'+q.tag;
    if(seen[key]||(used[q.tag]||0)>=cap)continue;
    seen[key]=1;used[q.tag]=(used[q.tag]||0)+1;out.push(q);
    if(out.length===n)break;
  }
  for(const q of all){if(out.length>=n)break;if(!out.includes(q))out.push(q)}
  return out;
}
const QZ={list:[],i:0,score:0,missed:[]};
function quizIntro(msg){
  $('#v-quiz').innerHTML=`<div class="quiz qintro">
    ${msg?`<p>${msg}</p>`:`<p>Ten questions drawn from your own notebook — capitals, currencies,
      populations, religions, the dishes you cooked and the books you read. Nothing is invented:
      every answer comes from your three sheets or from the country facts.</p>`}
    <div class="tools" style="margin-bottom:20px">
      <select id="qscope">
        <option value="mine">Countries I have started</option>
        <option value="all">Every country in the world</option>
      </select>
      <select id="qlen"><option value="10">10 questions</option>
        <option value="5">5 questions</option><option value="20">20 questions</option></select>
    </div>
    <button class="qstart" id="qgo">Start the quiz</button></div>`;
  $('#qgo').onclick=()=>{
    const n=+$('#qlen').value;
    const L=drawQuiz(n);
    if(L.length<3){quizIntro('Not enough data yet to build a quiz. Fill in a few more rows and come back.');return}
    QZ.list=L;QZ.i=0;QZ.score=0;QZ.missed=[];step();
  };
}
function step(){
  const q=QZ.list[QZ.i],n=QZ.list.length;
  $('#v-quiz').innerHTML=`<div class="quiz">
    <div class="qbar"><i style="width:${QZ.i/n*100}%"></i></div>
    <div class="qhead"><span>Question ${QZ.i+1} / ${n}</span>
      <span class="qtag ${q.tag.toLowerCase()}">${q.tag}</span></div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.kind==='mcq'
      ?`<div class="qopts">${q.opts.map((o,i)=>`<button class="qopt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`
      :`<div class="qform"><input id="qin" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Type your answer"><button class="qstart" id="qcheck">Check</button></div>`}
    <div id="qfb"></div></div>`;
  if(q.kind==='mcq')
    $('#v-quiz').querySelectorAll('.qopt').forEach(b=>b.onclick=()=>judge(+b.dataset.i===q.good,b));
  else{
    const go=()=>judge(q.accept.includes(norm($('#qin').value)),null,$('#qin').value);
    $('#qcheck').onclick=go;
    $('#qin').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
    $('#qin').focus();
  }
}
function judge(ok,btn,typed){
  const q=QZ.list[QZ.i];
  if(ok)QZ.score++;else QZ.missed.push({q:q.q,a:q.answer,you:typed||''});
  if(q.kind==='mcq'){
    $('#v-quiz').querySelectorAll('.qopt').forEach((b,i)=>{
      b.disabled=true;
      if(i===q.good)b.classList.add('right');
      else if(b===btn)b.classList.add('wrong');
    });
  }else{
    $('#qin').disabled=true;$('#qcheck').disabled=true;
  }
  const last=QZ.i===QZ.list.length-1;
  $('#qfb').innerHTML=`<div class="qfb ${ok?'right':'wrong'}">
    <p class="verdict">${ok?'Correct':'Not quite'}</p>
    ${ok?'':`<p>The answer was <b>${esc(q.a||q.answer)}</b>.</p>`}
    <div class="qacts">
      <button class="qstart" id="qnext">${last?'See the score':'Next question'}</button>
      ${!ok&&q.kind==='text'?`<button class="qlink" id="qmine">I was right, count it</button>`:''}
      <a class="qlink" href="#" id="qopen">Open ${esc(GEO[q.iso].n)}</a>
    </div></div>`;
  $('#qnext').onclick=()=>{QZ.i++;QZ.i<QZ.list.length?step():finish()};
  $('#qopen').onclick=ev=>{ev.preventDefault();openCountry(q.iso)};
  const mine=$('#qmine');
  if(mine)mine.onclick=()=>{QZ.score++;QZ.missed.pop();mine.remove();
    $('#qfb').querySelector('.qfb').className='qfb right';
    $('#qfb').querySelector('.verdict').textContent='Counted as correct'};
}
function finish(){
  const n=QZ.list.length;
  $('#v-quiz').innerHTML=`<div class="quiz">
    <div class="qbar"><i style="width:100%"></i></div>
    <p class="qscore">${QZ.score}<em> / ${n}</em></p>
    ${QZ.missed.length?`<div class="qmissed"><ul>${QZ.missed.map(m=>`<li>
      <div class="qq">${esc(m.q)}</div>
      <b>${esc(m.a)}</b>${m.you?` — you wrote « ${esc(m.you)} »`:''}</li>`).join('')}</ul></div>`
      :`<p style="margin-top:18px">Everything right.</p>`}
    <div class="qacts" style="margin-top:26px"><button class="qstart" id="qagain">Play again</button></div></div>`;
  $('#qagain').onclick=()=>quizIntro();
}

/* ---- boot ---- */
const note=$('#load');
function render(){stats();paint();['food','culture','books'].forEach(drawList);quizIntro()}
function foot(live){
  $('#foot').innerHTML=(live
    ?'Live from three Google Sheets — edit a cell, refresh, it is there (Google caches for about five minutes).'
    :'Showing the built-in snapshot of the cooking data.')+
    '<br>Country facts from mledoze/countries and Natural Earth · Robinson projection.';
}
async function grab(url){
  const r=await fetch(url+'&_='+Date.now());
  if(!r.ok)throw new Error(r.status);
  return records(await r.text());
}
async function boot(){
  render();foot(false);
  const urls=[SHEETS.food,SHEETS.culture,SHEETS.books];
  if(!urls.some(Boolean)){note.textContent='Built-in snapshot — no sheets connected.';return}
  note.textContent='Loading from Google Sheets…';
  try{
    const [f,c,b]=await Promise.all(urls.map(u=>u?grab(u):Promise.resolve([])));
    const E=build(f,c,b);
    if(!Object.keys(E).length)throw new Error('empty');
    DATA=E;render();foot(true);
    note.textContent=`Live from Google Sheets · ${f.length} food rows, ${c.length} culture notes, ${b.length} book rows`;
    note.className='load ok';
  }catch(err){
    note.textContent='Could not reach the sheets — showing the built-in snapshot. '+
      (location.protocol==='file:'?'Open the site through its web address, not as a local file.':'');
    note.className='load bad';
  }
}
boot();
</script>
